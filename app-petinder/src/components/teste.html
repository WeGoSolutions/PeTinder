<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --backgroundColor: #F4F4F4;
      --primaryColor: linear-gradient(90deg, #C7849E 0%, #FFC0D9 100%);
      --secondaryColor: linear-gradient(90deg, #80465D 0%, #59253A 100%);
      --tercearyColor: #FF8FBB;
    }

    body {
      background: var(--backgroundColor);
      font-family: 'Poppins', sans-serif;
      padding: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: 500;
    }

    input {
      width: 280px;
      height: 45px;
      padding: 10px 14px;
      border: 3px solid transparent; /* espaço da borda */
      border-radius: 10px;

      /* truque: fundo branco + borda gradiente */
      background: 
        #fff padding-box,
        var(--secondaryColor) border-box;

      font-size: 14px;
      transition: 0.3s;
    }

    input:focus {
      outline: none;
      background:
        #fff padding-box,
        var(--primaryColor) border-box; /* muda gradiente no foco */
    }
  </style>
</head>
<body>
  <label for="email">Email</label>
  <input type="email" id="email" placeholder="Digite seu email">
</body>
</html>
